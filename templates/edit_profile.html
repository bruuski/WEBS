{% extends "base.html" %}
{% block title %}Edit Profile — TuneSpace{% endblock %}
{% block content %}

<div class="panel">
<h2>Edit Profile</h2>
<div class="body">
<form method="post">
    <div class="row"><label>Display Name</label><input type="text" name="display_name" value="{{ user['display_name'] or '' }}"></div>
    <div class="row"><label>Headline / Tagline</label><input type="text" name="headline" value="{{ user['headline'] }}" placeholder="a quote you'd put in your bio"></div>
    <div class="row"><label>Mood</label><input type="text" name="mood" value="{{ user['mood'] }}"></div>
    <div class="row"><label>Avatar (single character/emoji)</label><input type="text" name="avatar_emoji" maxlength="4" value="{{ user['avatar_emoji'] }}"></div>
    <div class="row"><label>Location</label><input type="text" name="location" value="{{ user['location'] }}"></div>
    <div class="row"><label>Age</label><input type="number" name="age" value="{{ user['age'] or '' }}"></div>
    <div class="row"><label>Favorite Artists (comma-separated)</label><input type="text" name="fav_bands" value="{{ user['fav_bands'] }}"></div>
    <div class="row"><label>About Me (greentext with &gt;, quote with &gt;&gt;)</label><textarea name="about_me">{{ user['about_me'] }}</textarea></div>
    <div class="row"><label>Theme</label>
        <select name="theme">
            {% for t in ['mag','noir','lab'] %}
              <option value="{{ t }}" {% if user['theme']==t %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit">Save</button>
    <a class="btn ghost" href="{{ url_for('profile', username=user['username']) }}">Cancel</a>
</form>
</div>
</div>

{% endblock %}
